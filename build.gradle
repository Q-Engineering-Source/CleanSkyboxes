plugins {
    id "dev.architectury.loom" version "1.6-SNAPSHOT"
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "maven-publish"
}

group = project.mod_group_id
version = "${project.mod_version}+mc${project.minecraft_version}"

base {
    archivesName = project.mod_name
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    mavenCentral()
}

architectury {
    minecraft = project.minecraft_version
    platformSetupLoomIde()
    neoForge()
}

dependencies {
    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
    runs {
        client {
            client()
            setConfigName("NeoforgeSkyboxes Client")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_authors", project.mod_authors
    inputs.property "mod_license", project.mod_license
    inputs.property "mod_description", project.mod_description

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                version: project.version,
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_authors: project.mod_authors,
                mod_license: project.mod_license,
                mod_description: project.mod_description
        )
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
